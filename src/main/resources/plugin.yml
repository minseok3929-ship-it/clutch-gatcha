name: ClutchGacha
main: kr.clutch.gacha.ClutchGachaPlugin
version: ${version}
api-version: '1.21'
author: CLUTCH
softdepend:
  - Vault
  - ClutchTitle
  - ClutchLand
commands:
  가챠:
    description: 가챠 GUI를 열거나 설정을 리로드합니다.
    usage: /가챠 [리로드|상품추가|상품목록|상품삭제|상자생성|상자삭제]
    permission: clutch.gacha.use
  가챠권:
    description: 가챠권을 관리합니다.
    usage: /가챠권 지급 <닉네임> <개수>
    permission: clutch.gacha.admin
permissions:
  clutch.gacha.use:
    description: 가챠 GUI를 사용할 수 있습니다.
    default: true
  clutch.gacha.admin:
    description: 가챠 관리자 명령어를 사용할 수 있습니다.
    default: op
